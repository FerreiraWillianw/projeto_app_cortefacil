<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CorteFácil</title>

    <!-- Importando a Fonte 'Poppins' -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Importando a biblioteca de ícones da Phosphor Icons -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    
    <!-- Lembre-se de conectar o seu CSS aqui! -->
    <link rel="stylesheet" href="../src/css/style.css">
</head>
<body>
    <img src="../src/assets/logo-topo.png" alt="Logo CorteFácil" class="logo-topo">
    <div id="login-container">
        <h2>Login</h2> 
        
        <form id="form-login">
            
            <!-- Grupo do E-mail -->
            <label for="email"></label>
            <div class="input-wrapper">
                <i class="ph ph-user"></i>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>
            
            <!-- Grupo da Senha -->
            <label for="password"></label>
            <div class="input-wrapper">
                <i class="ph ph-lock"></i>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                <i class="ph ph-eye toggle-senha"></i>
            </div>
            
            <button id="btn-entrar" type="submit">Entrar</button>

            <p id="area-recuperar-senha" style="display: none; margin-top: 15px; font-size: 14px;">
                <a href="#" id="link-esqueci-senha" style="color: red; text-decoration: none; font-weight: 600;">Esqueceu a senha?</a>
            </p>
        </form>

        <div id="secao-recuperar-senha" style="display: none;">
            <h2>Recuperar Senha</h2>
            <p style="margin-bottom: 20px; font-size: 14px; color: #666;">
                Digite o seu e-mail cadastrado. Enviaremos um código de 6 dígitos para você criar uma nova senha
            </p>

            <form id="form-recuperar">
                <div class="input-wrapper">
                    <i class="ph ph-envelope"></i>
                    <input type="email" id="email-recuperacao" placeholder="Digite seu e-mail" required>
                </div>

                <button type="submit" id="btn-enviar-codigo-rec" class="btn-selecionar-barbearia">Enviar Código</button>

                <!-- Botão para voltar ao login se o usuário desistir -->
                <button type="button" id="btn-voltar-login" style="margin-top: 10px; background-color: #ccc; color: #333; width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Voltar ao Login</button>

            </form>
        </div>

        <div id="secao-nova-senha" style="display: none;">
            <h2>Criar Nova Senha</h2>
            <p style="margin-bottom: 20px; font-size: 14px; color: #666;">
                Digite o código de 6 dígitos enviado para o seu e-mail e crie uma nova senha.
            </p>

            <form id="form-nova-senha">
                <div class="input-wrapper">
                    <i class="ph ph-key"></i>
                    <input type="text" id="codigo-recuperacao" placeholder="Código de 6 dígitos" maxlength="6" required>
                </div>

                <div class="input-wrapper">
                    <i class="ph ph-lock"></i>
                    <input type="password" id="nova-senha" placeholder="Digite uma nova senha" required minlength="8">
                    <i class="ph ph-eye toggle-senha"></i>
                </div>

                <button type="submit" id="btn-salvar-senha" class="btn-selecionar-barbearia">Salvar Nova Senha</button>
            </form>
        </div>
        
        
        <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
    </div>
    <script src="../src/js/login.js"></script>
</body>
</html>

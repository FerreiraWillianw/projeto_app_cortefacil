<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CorteFácil</title>

    <!-- Importando a Fonte 'Poppins' -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Importando a biblioteca de ícones da Phosphor Icons -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    
    <!-- Lembre-se de conectar o seu CSS aqui! -->
    <link rel="stylesheet" href="../src\css\style.css">
</head>
<body>
    <img src="../src/assets/logo-topo.png" alt="Logo CorteFácil" class="logo-topo">
    <div id="login-container">
        <h2>Login</h2> 
        
        <form action="/login" method="POST">
            
            <!-- Grupo do E-mail -->
            <label for="email"></label>
            <div class="input-wrapper">
                <i class="ph ph-user"></i>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>
            
            <!-- Grupo da Senha -->
            <label for="password"></label>
            <div class="input-wrapper">
                <i class="ph ph-lock"></i>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
            </div>
            
            <button type="submit">Acessar</button>
        </form>
        
        <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro - CorteFácil</title>
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Adicione isto na secção <head> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    
    <link rel="stylesheet" href="../src/css/pagina_inicial.css">
</head>
<body>

    <!-- ==========================================
         MENU LATERAL (EXCLUSIVO DO BARBEIRO)
         ========================================== -->
    <aside id="sidebar">
        <div class="logo-container">
            <img src="../src/assets/logo-topo.png" alt="Logo CorteFácil">
        </div>
        
        <nav>
            <ul>
                <!-- A classe 'ativo' marca qual página estamos a ver agora -->
                <li>
                    <a href="#minha-agenda" class="ativo"><i class="ph ph-calendar-check"></i> Minha Agenda</a>
                </li>
                <li>
                    <a href="#meus-servicos"><i class="ph ph-scissors"></i> Meus Serviços</a>
                </li>
                <li>
                    <a href="#perfil"><i class="ph ph-user"></i> Meu Perfil</a>
                </li>
            </ul>
        </nav>

        <div class="logout">
            <a href="#" id="btn-sair"><i class="ph ph-sign-out"></i> Sair</a>
        </div>
    </aside>

    <!-- ==========================================
         ÁREA PRINCIPAL (GESTÃO DA BARBEARIA)
         ========================================== -->
    <main id="conteudo-principal">

        <!-- ABA 1: MINHA AGENDA (Visível por padrão) -->
        <section id="secao-minha-agenda">
            <header class="cabecalho-secao">
                <h2>Minha Agenda</h2>
                <p>Estes são os teus próximos clientes.</p>
            </header>

            <!-- ==========================================
                 FILTROS DA AGENDA
                 ========================================== -->
            <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                <!-- Filtro de Data -->
                <div class="input-wrapper" style="flex: 1; min-width: 200px; margin: 0;">
                    <i class="ph ph-calendar-blank"></i>
                    <input type="text" id="filtro-data" placeholder="Filtrar por data...">
                </div>
                
                <!-- Filtro de Status -->
                <div class="input-wrapper" style="flex: 1; min-width: 200px; margin: 0;">
                    <i class="ph ph-funnel"></i>
                    <select id="filtro-status" style="padding: 12px 12px 12px 40px; border-radius: 8px; border: 1px solid #ccc; width: 100%; font-family: 'Poppins';">
                        <option value="todos">Todos (Ativos)</option>
                        <option value="pendente">Pendentes</option>
                        <option value="concluido">Concluídos</option>
                        <option value="cancelado">Cancelados</option>
                    </select>
                </div>
            </div>
            
            <!-- Lista de compromissos que será preenchida pelo JavaScript -->
            <div id="lista-agendamentos" class="cards-container">
                <p style="text-align: center; color: #666;">A carregar a tua agenda...</p>
            </div>
        </section>

        <!-- ABA 2: MEUS SERVIÇOS (Escondida por padrão) -->
        <section id="secao-meus-servicos" style="display: none;">
            <header class="cabecalho-secao">
                <h2>Meus Serviços</h2>
                <p>Gere os cortes e preços que ofereces.</p>
            </header>
            <button class="btn-selecionar-barbearia" style="margin-bottom: 20px;">+ Adicionar Serviço</button>
            
            <div class="cards-container">
                <div class="card-barbearia">
                    <div class="card-info">
                        <h3>Corte Clássico</h3>
                        <p>R$ 35,00 • 30 minutos</p>
                    </div>
                    <!-- Botões de ação rápida para o barbeiro -->
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="btn-selecionar-barbearia" style="flex: 1; background-color: #eee; color: #333;">Editar</button>
                        <button class="btn-selecionar-barbearia" style="flex: 1; background-color: #ffeaea; color: #d63031;">Excluir</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ABA 3: MEU PERFIL (Escondida por padrão) -->
        <section id="secao-perfil" style="display: none;">
            <header class="cabecalho-secao">
                <h2>Meu Perfil</h2>
                <p>Mantenha os dados da sua barbearia atualizados.</p>
            </header>

            <form id="form-perfil" class="formulario-padrao">
                <div class="input-wrapper">
                    <i class="ph ph-user"></i>
                    <input type="text" id="nome-perfil" value="João Barbeiro" required>
                </div>

                <div class="input-wrapper">
                    <i class="ph ph-phone"></i>
                    <input type="tel" id="telefone-perfil" value="(24) 99999-9999" required>
                </div>

                <!-- Como o barbeiro tem login, faz sentido ele poder alterar o e-mail aqui -->
                <div class="input-wrapper">
                    <i class="ph ph-envelope"></i>
                    <input type="email" id="email-perfil" value="joao@cortefacil.com" required>
                </div>
                
                <button type="submit" class="btn-selecionar-barbearia">Salvar Alterações</button>
            </form>
        </section>

    </main>

    <!-- Adicione os scripts do Flatpickr aqui no final -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    <script src="../src/js/pagina_inicial.js"></script>
</body>
</html>

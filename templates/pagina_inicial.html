<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro - CorteFácil</title>
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Adicione isto na secção <head> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    
    <link rel="stylesheet" href="../src/css/pagina_inicial.css">
</head>
<body>

    <!-- ==========================================
         MENU LATERAL (EXCLUSIVO DO BARBEIRO)
         ========================================== -->
    <aside id="sidebar">
        <div class="logo-container">
            <img src="../src/assets/logo-topo.png" alt="Logo CorteFácil">
        </div>
        
        <nav>
            <ul>
                <!-- A classe 'ativo' marca qual página estamos a ver agora -->
                <li>
                    <a href="#minha-agenda" class="ativo"><i class="ph ph-calendar-check"></i> Minha Agenda</a>
                </li>
                <li>
                    <a href="#perfil"><i class="ph ph-user"></i> Meu Perfil</a>
                </li>
            </ul>
        </nav>

        <div class="logout">
            <a href="#" id="btn-sair"><i class="ph ph-sign-out"></i> Sair</a>
        </div>
    </aside>

    <!-- ==========================================
         ÁREA PRINCIPAL (GESTÃO DA BARBEARIA)
         ========================================== -->
    <main id="conteudo-principal">

        <!-- ABA 1: MINHA AGENDA (Visível por padrão) -->
        <section id="secao-minha-agenda">
            <header class="cabecalho-secao" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2>Minha Agenda</h2>
                    <p>Estes são os seus próximos clientes.</p>
                </div>
                <!-- Botão para abrir o Modal -->
                <button id="btn-abrir-modal-agendamento" class="btn-selecionar-barbearia" style="width: auto; padding: 10px 20px;">
                    + Novo Agendamento
                </button>
            </header>

            <!-- ==========================================
                 FILTROS DA AGENDA
                 ========================================== -->
            <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                <!-- Filtro de Data -->
                <div class="input-wrapper" style="flex: 1; min-width: 200px; margin: 0;">
                    <i class="ph ph-calendar-blank"></i>
                    <input type="text" id="filtro-data" placeholder="Filtrar por data...">
                </div>
                
                <!-- Filtro de Status -->
                <div class="input-wrapper" style="flex: 1; min-width: 200px; margin: 0;">
                    <i class="ph ph-funnel"></i>
                    <select id="filtro-status" style="padding: 12px 12px 12px 40px; border-radius: 8px; border: 1px solid #ccc; width: 100%; font-family: 'Poppins';">
                        <option value="todos">Todos (Ativos)</option>
                        <option value="pendente">Pendentes</option>
                        <option value="concluido">Concluídos</option>
                        <option value="cancelado">Cancelados</option>
                    </select>
                </div>
            </div>
            
            <!-- Lista de compromissos que será preenchida pelo JavaScript -->
            <div id="lista-agendamentos" class="cards-container">
                <p style="text-align: center; color: #666;">A carregar a tua agenda...</p>
            </div>
        </section>

        <!-- SEÇÃO 2: DISPONIBILIDADE (DIAS E HORÁRIOS OTIMIZADOS) -->
        <h3 class="titulo-sessao-perfil" style="margin-top: 30px;">Horário de Funcionamento</h3>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Toque nos dias para definir o horário de trabalho.</p>

        <div class="seletor-dias-semana" id="seletor-dias">
            <!-- Usamos data-dia para identificar o número do dia (Domingo = 0, Segunda = 1...) -->
            <button type="button" class="btn-dia-chip" data-dia="0">Dom</button>
            <button type="button" class="btn-dia-chip" data-dia="1">Seg</button>
            <button type="button" class="btn-dia-chip" data-dia="2">Ter</button>
            <button type="button" class="btn-dia-chip" data-dia="3">Qua</button>
            <button type="button" class="btn-dia-chip" data-dia="4">Qui</button>
            <button type="button" class="btn-dia-chip" data-dia="5">Sex</button>
            <button type="button" class="btn-dia-chip" data-dia="6">Sáb</button>
        </div>

        <!-- O recipiente vazio onde o JavaScript vai injetar os campos de hora -->
        <div id="container-horarios-dinamicos" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
            <!-- Os campos aparecerão aqui -->
        </div>

        <button type="submit" class="btn-selecionar-barbearia" style="margin-top: 25px; width: 100%;">
            Salvar Perfil e Horários
        </button>
        <!-- ==========================================
             MODAL DE AGENDAMENTO MANUAL
             ========================================== -->
        <div id="modal-agendamento" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Agendar Cliente</h3>
                    <button id="btn-fechar-modal" class="btn-fechar">&times;</button>
                </div>
                
                <form id="form-agendamento-manual" style="display: flex; flex-direction: column; gap: 15px;">
                    <div class="input-wrapper">
                        <i class="ph ph-user"></i>
                        <input type="text" id="manual-nome" placeholder="Nome do Cliente" required>
                    </div>
                    <div class="input-wrapper">
                        <i class="ph ph-phone"></i>
                        <!-- Como pediu, todos obrigatórios (required) -->
                        <input type="tel" id="manual-telefone" placeholder="Telefone do Cliente" required>
                    </div>
                    <div class="input-wrapper">
                        <i class="ph ph-calendar-blank"></i>
                        <input type="text" id="manual-data" placeholder="Escolha a data" required>
                    </div>
                    <div class="input-wrapper">
                        <i class="ph ph-clock"></i>
                        <!-- Trocamos o input pelo select para receber as opções do Python -->
                        <select id="manual-hora" required disabled style="padding-left: 40px; border-radius: 8px; border: 1px solid #ccc; width: 100%; font-family: 'Poppins'; background-color: white;">
                            <option value="" disabled selected>Escolha uma data primeiro...</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-selecionar-barbearia" style="width: 100%; margin-top: 10px;">
                        Confirmar Horário
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- Adicione os scripts do Flatpickr aqui no final -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    <script src="../src/js/components/components.js"></script>
    <script src="../src/js/components/formatador_telefone.js"></script>
    <script src="../src/js/pagina_inicial.js"></script>
</body>
</html>
